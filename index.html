<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durga Mata - Drawing Animation</title>
<style>
    .navratri-wish {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    width: 100%;
    pointer-events: none;
}

.navratri-wish h1 {
    margin: 0;

    font-family: Georgia, serif;
    font-size: 38px;
    font-weight: bold;

    color: #a21b1b;

    letter-spacing: 2px;

    text-shadow:
        1px 1px 0 #e8c77b,
        0 0 12px rgba(180, 100, 20, 0.25);

    animation: wishAppear 2s ease forwards;
}

.navratri-wish p {
    margin-top: 8px;

    font-family: Georgia, serif;
    font-size: 16px;

    color: #5d4025;

    line-height: 1.5;

    animation: wishAppear 2s ease 0.5s both;
}

.navratri-wish span {
    display: block;

    color: #a21b1b;
    font-weight: bold;
}


/* Wish animation */

@keyframes wishAppear {

    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Mobile */

@media (max-width: 600px) {

    .navratri-wish h1 {
        font-size: 30px;
    }

    .navratri-wish p {
        font-size: 14px;
    }
}
*{box-sizing:border-box}
body{
    margin:10px;
    
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
}
svg{
    width:min(92vw,700px);
    height:auto;
}
.line{
    stroke:#111;
    fill:none;
    stroke-width:.78;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation:draw 2.2s linear forwards;
    animation-delay:var(--delay);
}
@keyframes draw{
    to{stroke-dashoffset:0}
}
</style>
</head>

    <div class="navratri-wish">
        <h1>Happy Navratri</h1>

        <p>
            May Maa Durga fill your life with
            <span>strength, happiness & blessings</span>
        </p>
    </div>
